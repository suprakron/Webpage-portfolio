    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .gallery-item {
            background: #0a1628;
            border: 1px solid rgba(59, 130, 246, 0.18);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .gallery-item:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 0 36px rgba(59, 130, 246, 0.15);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img { transform: scale(1.06); }

        .gallery-item-overlay {
            position: absolute;
            inset: 0;
            background: rgba(30, 64, 175, 0);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }
        .gallery-item:hover .gallery-item-overlay {
            background: rgba(14, 30, 80, 0.35);
        }
        .gallery-item-overlay i {
            color: white;
            font-size: 1.8rem;
            opacity: 0;
            transform: scale(0.7);
            transition: all 0.3s ease;
        }
        .gallery-item:hover .gallery-item-overlay i {
            opacity: 1;
            transform: scale(1);
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .gallery-item img { height: 150px; }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.gallery-item[data-img]').forEach(item => {
        item.addEventListener('click', () => {
            document.getElementById('galleryModalImg').src = item.dataset.img;
        });
    });

    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.05 });
    document.querySelectorAll('.fade-up').forEach((el, i) => {
        el.style.transitionDelay = `${(i % 5) * 50}ms`;
        obs.observe(el);
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
</script>
